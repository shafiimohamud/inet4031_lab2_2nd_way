<!-- ───────────── Lakebound Transportation · logo loader ─────────────
     Paste this whole block as the FIRST thing inside <body>.
     Options (attributes on #lb-loader):
       data-ready="auto"    hide when the page has finished loading (default)
       data-ready="manual"  stay until your app calls  LakeboundLoader.done()
       data-show="entry"    show on first open + refresh, skip in-site link clicks (default)
       data-show="always"   show on every full page load
       data-max-wait="8000" safety net: never stay longer than this many ms
       data-theme="auto"    white screen, or the dark version when the visitor's device is in dark mode (default)
       data-theme="light"   always the white screen
       data-theme="dark"    always the dark screen (navy, white logo, teal arrows)
     ─────────────────────────────────────────────────────────────────── -->
<style id="lb-loader-css">
  #lb-loader {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483647;
    display: flex; align-items: center; justify-content: center;
    --lb-bg: #fff; --lb-ink: #102344;
    background: #fff; background: var(--lb-bg); opacity: 1; will-change: opacity;
    transition: opacity .45s cubic-bezier(.4, 0, 1, 1), visibility 0s linear .45s;
    /* CSS-only safety net in case scripts fail: the screen can never get stuck */
    animation: lb-failsafe .4s ease 12s forwards;
  }
  #lb-loader.lb-hide { opacity: 0; visibility: hidden; pointer-events: none; }

  /* dark mode, matching the app icon: navy screen, white L / T / shield, teal arrows */
  @media (prefers-color-scheme: dark) {
    #lb-loader:not([data-theme="light"]) { --lb-bg: #102344; --lb-ink: #fff; }
  }
  #lb-loader[data-theme="dark"] { --lb-bg: #102344; --lb-ink: #fff; }

  #lb-loader .lb-logo {
    display: block; overflow: visible;
    width: 240px; width: clamp(184px, 52vw, 288px); height: auto; max-height: 70vh;
    transition: transform .45s cubic-bezier(.4, 0, 1, 1);
  }
  #lb-loader.lb-hide .lb-logo { transform: scale(1.03); }
  #lb-loader .lb-ink, #lb-loader .lb-ink * { fill: #102344; fill: var(--lb-ink); }
  #lb-loader .lb-teal, #lb-loader .lb-teal * { fill: #3fa89c; }
  #lb-loader .lb-lens { fill: #102344; }

  /* ── assembly: each piece of the logo glides into place ── */
  #lb-loader .lb-p {
    opacity: 0;
    animation-duration: .58s;
    animation-timing-function: cubic-bezier(.22, 1, .36, 1);
    animation-fill-mode: both;
  }
  #lb-loader .lb-l       { animation-name: lb-from-left;    animation-delay: 0s;   animation-duration: .6s; }
  #lb-loader .lb-blade   { animation-name: lb-from-left-s;  animation-delay: .06s; animation-duration: .6s; }
  #lb-loader .lb-t-stem  { animation-name: lb-from-below;   animation-delay: .2s; }
  #lb-loader .lb-t-bar   { animation-name: lb-from-left-s;  animation-delay: .28s; }
  #lb-loader .lb-base    { animation-name: lb-from-below-s; animation-delay: .34s; }
  #lb-loader .lb-arrow   { animation-name: lb-from-left;    animation-delay: .46s; animation-duration: .6s; }
  #lb-loader .lb-swoosh  { animation-name: lb-sweep-up;     animation-delay: .54s; animation-duration: .6s; }
  #lb-loader .lb-cross   { animation-name: lb-cross;        animation-delay: .86s; animation-duration: .5s; transform-origin: 240.1px 360.7px; }
  #lb-loader .lb-word    { animation-name: lb-rise;         animation-delay: 1s;   animation-duration: .5s; }

  @keyframes lb-from-left    { 0% { opacity: 0; transform: translateX(-112px); } 50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes lb-from-left-s  { 0% { opacity: 0; transform: translateX(-62px); }  50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes lb-from-below   { 0% { opacity: 0; transform: translateY(42px); }   50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes lb-from-below-s { 0% { opacity: 0; transform: translateY(22px); }   50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes lb-sweep-up     { 0% { opacity: 0; transform: translate(-24px, 92px); } 50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes lb-cross        { 0% { opacity: 0; transform: scale(.84); } 100% { opacity: 1; transform: none; } }
  @keyframes lb-rise         { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }

  /* soft teal glow behind the medical cross: blooms once, then pulses with the breathing */
  #lb-loader .lb-glow {
    opacity: 0;
    animation: lb-glow 1.05s ease-out .86s both, lb-glow-breathe 3.2s ease-in-out 2s infinite;
  }
  @keyframes lb-glow         { 0% { opacity: 0; } 40% { opacity: .8; } 100% { opacity: 0; } }
  @keyframes lb-glow-breathe { 0%, 100% { opacity: 0; } 50% { opacity: .5; } }

  /* still loading after the logo is complete: a very subtle breath instead of a spinner */
  #lb-loader .lb-mark {
    transform-origin: 240.0px 226.8px;
    animation: lb-breathe 3.2s ease-in-out 2s infinite;
  }
  @keyframes lb-breathe  { 0%, 100% { transform: none; } 50% { transform: scale(1.022); } }
  @keyframes lb-failsafe { to { opacity: 0; visibility: hidden; } }

  /* visitors who prefer reduced motion get the finished logo and a plain fade */
  @media (prefers-reduced-motion: reduce) {
    #lb-loader .lb-p, #lb-loader .lb-mark, #lb-loader .lb-glow { animation: none; transform: none; }
    #lb-loader .lb-p { opacity: 1; }
    #lb-loader, #lb-loader .lb-logo { transition-duration: .2s, 0s; transition-delay: 0s, .2s; }
    #lb-loader.lb-hide .lb-logo { transform: none; }
  }
</style>
<noscript><style>#lb-loader { display: none; }</style></noscript>

  if (el.getAttribute('data-show') !== 'always') {
    try {
      var nav = performance.getEntriesByType('navigation')[0], type = nav ? nav.type : 'navigate';
      var inSite = d.referrer && new URL(d.referrer).origin === location.origin;
      if (type === 'back_forward' || (type === 'navigate' && inSite)) {
        el.style.display = 'none';
        d.addEventListener('DOMContentLoaded', remove);
        w.LakeboundLoader = { done: function () {} };
        return;
      }
    } catch (e) {}
  }

  function done() {
    if (gone) return;
    gone = true;
    // Page ready before the logo finished assembling? Don't make anyone wait:
    // let the remaining pieces settle quickly while the screen is already fading.
    try {
      var left = 0, anims = el.getAnimations({ subtree: true }).filter(function (a) {
        var t = a.effect && a.effect.getComputedTiming();

      anims.forEach(function (a) {

      });
      if (left > 250) anims.forEach(function (a) { a.playbackRate = left / 250; });
    } catch (e) {}
    el.classList.add('lb-hide');
    var timer = setTimeout(remove, 900);
    el.addEventListener('transitionend', function (e) {
      if (e.target === el) { clearTimeout(timer); remove(); }
    });
  }

  w.LakeboundLoader = { done: done };
  if (el.getAttribute('data-ready') !== 'manual') {
    if (d.readyState === 'complete') done(); else w.addEventListener('load', done);

  w.addEventListener('pageshow', function (e) { if (e.persisted) done(); });

})(window, document);
</script>
